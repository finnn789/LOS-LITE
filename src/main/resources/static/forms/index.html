<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Form - LOS LITE</title>
<link rel="stylesheet" href="forms.css">
</head>
<body>

<div class="container wide">
    <div class="card">
        <h1>Daftar Form</h1>
        <p class="subtitle">Form dinamis yang tersedia dari Auto Layout</p>

        <div id="banner" class="banner"></div>
        <div id="skeleton" class="skeleton">Mengambil daftar form&hellip;</div>

        <div class="table-wrap">
            <table class="forms-table" id="formsTable" style="display:none;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nama Form</th>
                        <th>Status</th>
                        <th>Versi</th>
                        <th>Dibuat</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="formsTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="auto-layout-config.js"></script>
<script src="forms-list.js"></script>

</body>
</html>
