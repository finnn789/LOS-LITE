spring:
  application:
    name: los-lite
  datasource:
    url: jdbc:postgresql://localhost:5432/los_lite
    username: ${DB_USERNAME:los_lite}
    password: ${DB_PASSWORD:los_lite}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  # 8082, BUKAN 8081 lagi - 8081 sekarang dipakai WORKFLOW sendiri (lihat blok
  # workflow-app di bawah), jadi harus beda port dari LOS-LITE atau dua service ini
  # tidak akan bisa jalan bersamaan di mesin yang sama.
  port: ${SERVER_PORT:8082}
# WORKFLOW: workflow engine terpisah (org.lite.project.workflow, lihat
# component/WorkflowAppClient.java & component/WorkflowSocketClient.java untuk
# pemakaiannya). BUKAN LAGI WORKFLOW-APP/Camunda. workflow-key di bawah HARUS SAMA PERSIS
# dengan field "workflowKey" yang dipakai saat POST /api/workflows/deploy (form-data,
# BUKAN diambil dari <bpmn:process id="..."> di file .bpmn-nya - dua hal itu independen).
# BPMN yang di-deploy sekarang punya 2 exclusiveGateway (Gateway_ScoringDecision berdasar
# variable "decision", gateway_review berdasar variable "reviewDecision") - node id-nya
# SENGAJA disamakan dengan TASK_DEFINITION_*/EXTERNAL_TASK_TOPIC_* di
# LoanApplicationWorkflowService (verifikasi_dokumen, jalankan_scoring, officer_review,
# disburse_task), jadi submit()/moveToDocumentVerification()/runScoring()/review()/
# disburse() semuanya nyambung tanpa ubah kode itu - workflow-key di bawah sudah
# disesuaikan ke "los-lite-bpmn", persis field workflowKey yang dipakai saat deploy.
# WORKFLOW mewajibkan HTTP Basic Auth di semua endpoint /api/** DAN handshake WebSocket
# /ws (lihat dokumentasi API WORKFLOW) - beda dari WORKFLOW-APP dulu yang pakai Bearer
# service-token; username/password di bawah dipasang sebagai default header oleh
# WebClientConfig/WorkflowSocketClient. Fallback dev admin/admin123 SAMA PERSIS dengan
# fallback dev bawaan WORKFLOW sendiri kalau WORKFLOW_API_USERNAME/PASSWORD tidak diset di
# sana - HARUS di-override berbarengan di kedua sisi kalau mau ganti kredensial.
workflow-app:
  enabled: ${WORKFLOW_APP_ENABLED:true}
  base-url: ${WORKFLOW_APP_BASE_URL:http://localhost:8081}
  ws-url: ${WORKFLOW_APP_WS_URL:ws://localhost:8081/ws}
  workflow-key: ${WORKFLOW_APP_WORKFLOW_KEY:los-lite-bpmn}
  username: ${WORKFLOW_API_USERNAME:admin}
  password: ${WORKFLOW_API_PASSWORD:admin123}
jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-jangan-dipakai-di-production-ganti-ini}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 jam
# Secret buat verifikasi token dari Auto-Layout (X-Service-Token), TERPISAH dari jwt.secret
# di atas (yang buat sesi login user) - harus identik dengan LOS_LITE_JWT_SECRET yang dipakai
# Auto-Layout pas generate token (lihat GenerateLosLiteServiceToken.java di project itu).
autolayout:
  service:
    jwt-secret: ${AUTOLAYOUT_SERVICE_JWT_SECRET:dev-only-secret-buat-service-token-ke-los-lite-ganti-ini}
