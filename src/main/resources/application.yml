spring:
  application:
    name: los-lite
  datasource:
    url: jdbc:postgresql://localhost:5432/los_lite
    username: ${DB_USERNAME:los_lite}
    password: ${DB_PASSWORD:los_lite}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: 8081
# WORKFLOW-APP: workflow orchestrator terpisah (Camunda 7 external, lihat
# workflow/LoanApplicationWorkflowService.java untuk pemakaiannya). service-token BELUM
# final - tim WORKFLOW-APP belum konfirmasi algoritma JWT (RS256/JWKS vs HS256) & klaim
# role yang diharapkan, jadi sementara ini string mentah dikirim apa adanya sebagai
# Authorization: Bearer <token>. Ganti WORKFLOW_APP_SERVICE_TOKEN begitu sudah dikonfirmasi.
workflow-app:
  enabled: ${WORKFLOW_APP_ENABLED:true}
  base-url: ${WORKFLOW_APP_BASE_URL:http://localhost:8090}
  service-token: ${WORKFLOW_APP_SERVICE_TOKEN:}
  service-code: ${WORKFLOW_APP_SERVICE_CODE:LOS-LITE}
  business-flow-code: ${WORKFLOW_APP_BUSINESS_FLOW_CODE:LOAN_ORIGINATION}
jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-jangan-dipakai-di-production-ganti-ini}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 jam
# Secret buat verifikasi token dari Auto-Layout (X-Service-Token), TERPISAH dari jwt.secret
# di atas (yang buat sesi login user) - harus identik dengan LOS_LITE_JWT_SECRET yang dipakai
# Auto-Layout pas generate token (lihat GenerateLosLiteServiceToken.java di project itu).
autolayout:
  service:
    jwt-secret: ${AUTOLAYOUT_SERVICE_JWT_SECRET:dev-only-secret-buat-service-token-ke-los-lite-ganti-ini}
